# Daha önce yayınlanmış bir GitHub Release'in exe'lerini sshmasters.com'a yükler (var olanlar 409 ile atlanır).
# Actions › "sshmasters.com'a yükle" › Run workflow › etiket (ör. v1.2.0).
name: sshmasters.com'a yükle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (ör. v1.2.0)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # etiket açıklaması (sürüm notu) için

      - name: Release'teki exe'leri indir
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -p 'SSH-Master-Setup-*.exe' -p 'SSH-Master-Portable-*.exe' -D dist

      - name: sshmasters.com'a yükle
        env:
          SSHM_RELEASE_KEY: ${{ secrets.SSHM_RELEASE_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          V="${TAG#v}"
          bash scripts/upload-sshmasters.sh "$V" "dist/SSH-Master-Setup-$V.exe" "$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")" "dist/SSH-Master-Portable-$V.exe"
