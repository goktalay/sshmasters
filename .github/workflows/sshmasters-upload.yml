# Daha önce yayınlanmış bir GitHub Release'in kurulum exe'sini sshmasters.com'a yükler.
# Actions › "sshmasters.com'a yükle" › Run workflow › etiket (ör. v1.2.0).
name: sshmasters.com'a yükle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (ör. v1.2.0)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # etiket açıklaması (sürüm notu) için

      - name: Release'teki kurulum exe'sini indir
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -p 'SSH-Master-Setup-*.exe' -D dist

      - name: sshmasters.com'a yükle
        env:
          SSHM_RELEASE_KEY: ${{ secrets.SSHM_RELEASE_KEY }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/upload-sshmasters.sh "${TAG#v}" "dist/SSH-Master-Setup-${TAG#v}.exe" "$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")"
