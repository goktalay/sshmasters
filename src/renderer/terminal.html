<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>SSH Master</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <div class="layout" id="layout">

    <main class="term-area">
      <div class="term-bar">
        <button class="icon-btn" id="toggleSidebar" title="Tüm sol panelleri aç/kapat"></button>
        <span class="term-title" id="termTitle">SSH Master</span>
        <span class="term-sub" id="termSub"></span>
        <span style="flex:1"></span>
        <button class="btn sm ghost" id="btnSync" title="Yazdıklarınız tüm bağlı bölmelere gönderilir"></button>
        <button class="btn sm ghost" id="btnSplitRight" title="Aktif bölmeyi sağa böl (Ctrl+Shift+E)"></button>
        <button class="btn sm ghost" id="btnSplitDown" title="Aktif bölmeyi aşağı böl (Ctrl+Shift+O)"></button>
      </div>
      <div class="panes" id="panes"></div>
    </main>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="ui.js"></script>
  <script src="themes.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
